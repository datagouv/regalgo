[project]
name = "regalgo"
authors = [{name = "Quentin Loridant", email = "quentin.loridant.ext@numerique.gouv.fr"}]
version = "0.0.4"
description = "Wrapper de standardisation d'algorithmes publics en python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pydantic>=2.13.5",
]

[project.scripts]
regalgo = "regalgo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regalgo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
